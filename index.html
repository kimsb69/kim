<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="말 두 마리와 당근을 담은, GPT로 만든 웹사이트입니다.">
  <meta name="theme-color" content="#5b9bd5">
  <title>Gpt로 만든 웹사이트</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    main { width: min(100%, 640px); margin-inline: auto; container-type: inline-size; padding-top: 5.3125%; }
    h1 { width: 77.1875%; height: 13.4375cqw; margin: 0 0 3.75cqw 6.71875%; display: flex; align-items: center; justify-content: center; background: #5b9bd5; color: white; font-size: 7.1875cqw; font-weight: 400; line-height: 1.2; white-space: nowrap; letter-spacing: .05em; }
    .scene { position: relative; width: 100%; aspect-ratio: 640 / 216; overflow: hidden; margin: 0; }
    .scene img { display: block; position: absolute; width: 100%; height: auto; top: -66.666667%; left: 0; }
    @media (min-width: 640px) { main { padding-top: 34px; } }
    @media print { main { width: 640px; max-width: 100%; } }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <h1 id="page-title">Gpt로 만든 웹사이트</h1>
    <figure class="scene" aria-label="말과 당근">
      <img src="reference.png" alt="왼쪽에 서 있는 갈색 말, 가운데 주황색 당근, 오른쪽에 달리는 갈색 말" width="640" height="360">
    </figure>
  </main>
</body>
</html>
